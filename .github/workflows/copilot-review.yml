name: Request Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Request Copilot Review
        run: |
          gh pr review ${{ github.event.pull_request.number }} --comment --body "@github-copilot review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
