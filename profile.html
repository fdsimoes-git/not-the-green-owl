<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile - Not The Green Owl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        :root {
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --color-bg-deep: #0a0f1a; --color-bg-base: #0f172a; --color-bg-elevated: #1e293b; --color-bg-surface: #334155;
            --color-accent-primary: #f59e0b; --color-accent-secondary: #fbbf24; --color-accent-tertiary: #d97706;
            --color-success: #10b981; --color-success-muted: rgba(16,185,129,0.15);
            --color-danger: #ef4444; --color-danger-muted: rgba(239,68,68,0.15);
            --color-text-primary: #f8fafc; --color-text-secondary: #94a3b8; --color-text-muted: #64748b;
            --color-border: rgba(148,163,184,0.15);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5); --radius-md: 12px; --radius-lg: 20px; --transition-base: 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--color-bg-deep); color: var(--color-text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
        body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; z-index: 1000; }

        .nav { position: sticky; top: 0; z-index: 100; background: rgba(15,23,42,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--color-border); padding: 0 2rem; display: flex; align-items: center; height: 64px; }
        .nav-brand { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--color-accent-primary); margin-right: 2rem; text-decoration: none; }
        .nav-links { display: flex; gap: 0.25rem; flex: 1; }
        .nav-links a { color: var(--color-text-secondary); text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; transition: all var(--transition-base); }
        .nav-links a:hover, .nav-links a.active { color: var(--color-text-primary); background: var(--color-bg-elevated); }
        .nav-links a.active { color: var(--color-accent-primary); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-right .logout-btn { background: none; border: 1px solid var(--color-border); color: var(--color-text-secondary); padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body); transition: all var(--transition-base); }
        .nav-right .logout-btn:hover { border-color: var(--color-danger); color: var(--color-danger); }

        .main { max-width: 700px; margin: 0 auto; padding: 2rem; }
        .page-title { font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin-bottom: 2rem; }

        .section { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 1.5rem; animation: fadeInUp 0.5s ease backwards; }
        .section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--color-accent-primary); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.8rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-group input, .form-group select { width: 100%; padding: 0.85rem 1rem; background: var(--color-bg-base); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 0.95rem; color: var(--color-text-primary); transition: all var(--transition-base); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--color-accent-primary); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
        .form-group select { cursor: pointer; }
        .form-group small { display: block; margin-top: 0.4rem; font-size: 0.75rem; color: var(--color-text-muted); }

        .btn { padding: 0.85rem 2rem; border: none; border-radius: var(--radius-md); font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all var(--transition-base); }
        .btn-primary { background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-tertiary)); color: var(--color-bg-deep); box-shadow: 0 4px 24px rgba(245,158,11,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(245,158,11,0.4); }
        .btn-secondary { background: var(--color-bg-surface); color: var(--color-text-primary); }
        .btn.loading { position: relative; color: transparent !important; pointer-events: none; }
        .btn.loading::after { content: ''; position: absolute; width: 20px; height: 20px; top: 50%; left: 50%; margin: -10px 0 0 -10px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }

        .message { padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; display: none; margin-bottom: 1rem; }
        .message.show { display: block; animation: fadeInUp 0.3s ease; }
        .message.success { background: var(--color-success-muted); border: 1px solid rgba(16,185,129,0.3); color: var(--color-success); }
        .message.error { background: var(--color-danger-muted); border: 1px solid rgba(239,68,68,0.3); color: var(--color-danger); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stat-card { text-align: center; padding: 1.25rem; background: var(--color-bg-base); border-radius: var(--radius-md); }
        .stat-card .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-accent-primary); }
        .stat-card .stat-label { font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.25rem; }

        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
        .achievement-card { padding: 1rem; background: var(--color-bg-base); border-radius: var(--radius-md); border: 1px solid var(--color-border); text-align: center; }
        .achievement-card.earned { border-color: var(--color-accent-primary); }
        .achievement-card.locked { opacity: 0.4; }
        .achievement-card .ach-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .achievement-card h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
        .achievement-card p { font-size: 0.7rem; color: var(--color-text-muted); }

        .twofa-status { display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: var(--color-bg-base); border-radius: var(--radius-md); }
        .twofa-status .status-text { font-size: 0.9rem; }
        .twofa-status .status-badge { padding: 0.2rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .twofa-status .status-badge.enabled { background: var(--color-success-muted); color: var(--color-success); }
        .twofa-status .status-badge.disabled { background: rgba(100,116,139,0.15); color: var(--color-text-muted); }

        .loading-container { display: flex; justify-content: center; padding: 4rem; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--color-border); border-top-color: var(--color-accent-primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        .hidden { display: none !important; }
        .lang-toggle { position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 999; width: 2.5rem; height: 2.5rem; padding: 0; background: var(--color-bg-elevated); color: var(--color-text-secondary); border: 1px solid var(--color-border); border-radius: 50%; font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .nav { padding: 0 1rem; } .nav-links { display: none; }
            .main { padding: 1.5rem 1rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <button class="lang-toggle" onclick="setLang(getLang()==='en'?'pt':'en')">🌐</button>
    <nav class="nav">
        <a href="/index.html" class="nav-brand">Not The Green Owl</a>
        <div class="nav-links">
            <a href="/index.html" data-i18n="dash.title">Dashboard</a>
            <a href="/learn.html" data-i18n="learn.title">Learn</a>
            <a href="/profile.html" class="active" data-i18n="profile.title">Profile</a>
            <a href="/leaderboard.html" data-i18n="leader.title">Leaderboard</a>
        </div>
        <div class="nav-right">
            <button class="logout-btn" id="logoutBtn" data-i18n="common.logout">Logout</button>
        </div>
    </nav>

    <div class="main">
        <h1 class="page-title" data-i18n="profile.title">Profile</h1>
        <div id="loadingContainer" class="loading-container"><div class="spinner"></div></div>

        <div id="profileContent" class="hidden">
            <div id="profileMsg" class="message"></div>

            <!-- Learning Settings -->
            <div class="section">
                <h3 data-i18n="profile.title">Learning Settings</h3>
                <form id="profileForm">
                    <div class="form-group">
                        <label data-i18n="profile.displayName">Display Name</label>
                        <input type="text" id="displayName" maxlength="50" placeholder="Your display name">
                    </div>
                    <div class="form-group">
                        <label data-i18n="profile.targetBand">Target Band Score</label>
                        <select id="targetBand">
                            <option value="5">5.0</option><option value="5.5">5.5</option>
                            <option value="6">6.0</option><option value="6.5" selected>6.5</option>
                            <option value="7">7.0</option><option value="7.5">7.5</option>
                            <option value="8">8.0</option><option value="8.5">8.5</option>
                            <option value="9">9.0</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="profile.dailyGoal">Daily XP Goal</label>
                        <select id="dailyGoalXp">
                            <option value="20">20 XP (Casual)</option>
                            <option value="50" selected>50 XP (Regular)</option>
                            <option value="100">100 XP (Serious)</option>
                            <option value="200">200 XP (Intense)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="profile.track">IELTS Track</label>
                        <select id="preferredTrack">
                            <option value="academic" data-i18n="profile.academic">Academic</option>
                            <option value="general" data-i18n="profile.general">General Training</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
                </form>
            </div>

            <!-- Stats -->
            <div class="section">
                <h3 data-i18n="profile.stats">Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value" id="statXp">0</div><div class="stat-label" data-i18n="dash.totalXp">Total XP</div></div>
                    <div class="stat-card"><div class="stat-value" id="statStreak">0</div><div class="stat-label" data-i18n="dash.streak">Day Streak</div></div>
                    <div class="stat-card"><div class="stat-value" id="statLessons">0</div><div class="stat-label" data-i18n="dash.lessonsCompleted">Lessons Done</div></div>
                </div>
            </div>

            <!-- Achievements -->
            <div class="section">
                <h3 data-i18n="profile.achievements">Achievements</h3>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <!-- Security -->
            <div class="section">
                <h3 data-i18n="profile.security">Security</h3>
                <div class="form-group">
                    <label data-i18n="profile.email">Email</label>
                    <div id="emailDisplay" style="font-size: 0.9rem; color: var(--color-text-secondary);"></div>
                </div>
                <div class="twofa-status">
                    <span class="status-text" data-i18n="profile.twoFA">Two-Factor Authentication</span>
                    <span class="status-badge" id="twofaBadge"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/csrf.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
