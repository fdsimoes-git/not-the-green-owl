<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Learn - Not The Green Owl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        :root {
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --color-bg-deep: #0a0f1a;
            --color-bg-base: #0f172a;
            --color-bg-elevated: #1e293b;
            --color-bg-surface: #334155;
            --color-accent-primary: #f59e0b;
            --color-accent-secondary: #fbbf24;
            --color-accent-tertiary: #d97706;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --color-text-primary: #f8fafc;
            --color-text-secondary: #94a3b8;
            --color-text-muted: #64748b;
            --color-border: rgba(148, 163, 184, 0.15);
            --color-listening: #3b82f6;
            --color-reading: #10b981;
            --color-writing: #f59e0b;
            --color-speaking: #ef4444;
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition-base: 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--color-bg-deep); color: var(--color-text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
        body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; z-index: 1000; }

        .nav { position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--color-border); padding: 0 2rem; display: flex; align-items: center; height: 64px; }
        .nav-brand { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--color-accent-primary); margin-right: 2rem; text-decoration: none; }
        .nav-links { display: flex; gap: 0.25rem; flex: 1; }
        .nav-links a { color: var(--color-text-secondary); text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; transition: all var(--transition-base); }
        .nav-links a:hover, .nav-links a.active { color: var(--color-text-primary); background: var(--color-bg-elevated); }
        .nav-links a.active { color: var(--color-accent-primary); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-right .logout-btn { background: none; border: 1px solid var(--color-border); color: var(--color-text-secondary); padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body); transition: all var(--transition-base); }
        .nav-right .logout-btn:hover { border-color: var(--color-danger); color: var(--color-danger); }

        .main { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .breadcrumb { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--color-text-muted); }
        .breadcrumb a { color: var(--color-accent-primary); text-decoration: none; cursor: pointer; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .sep { color: var(--color-text-muted); }
        .page-title { font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin-bottom: 2rem; }

        .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        .skill-card { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2rem; cursor: pointer; transition: all var(--transition-base); position: relative; overflow: hidden; animation: fadeInUp 0.5s ease backwards; }
        .skill-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .skill-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(245,158,11,0.3); }
        .skill-card h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .skill-card .skill-stats { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 1rem; }
        .skill-card .progress-bar { height: 6px; background: var(--color-bg-surface); border-radius: 3px; overflow: hidden; }
        .skill-card .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

        .levels-list, .lessons-list { display: flex; flex-direction: column; gap: 1rem; }
        .level-card { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.5rem; cursor: pointer; transition: all var(--transition-base); display: flex; align-items: center; gap: 1.5rem; animation: fadeInUp 0.4s ease backwards; }
        .level-card:hover:not(.locked) { transform: translateX(4px); border-color: var(--color-accent-primary); }
        .level-card.locked { opacity: 0.5; cursor: not-allowed; }
        .level-card .level-info { flex: 1; }
        .level-card .level-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
        .level-card .level-meta { font-size: 0.8rem; color: var(--color-text-muted); }
        .level-badge { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: 600; }
        .level-badge.unlocked { background: rgba(16,185,129,0.15); color: var(--color-success); }
        .level-badge.locked-badge { background: rgba(100,116,139,0.15); color: var(--color-text-muted); }

        .lesson-card { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.25rem 1.5rem; cursor: pointer; transition: all var(--transition-base); display: flex; align-items: center; gap: 1.25rem; animation: fadeInUp 0.4s ease backwards; text-decoration: none; color: inherit; }
        .lesson-card:hover { border-color: var(--color-accent-primary); transform: translateX(4px); }
        .lesson-status { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--color-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.8rem; }
        .lesson-status.done { background: var(--color-success); border-color: var(--color-success); color: white; }
        .lesson-info { flex: 1; }
        .lesson-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
        .lesson-meta { font-size: 0.8rem; color: var(--color-text-muted); display: flex; gap: 1rem; flex-wrap: wrap; }
        .lesson-score { font-size: 0.8rem; color: var(--color-accent-primary); font-weight: 600; }

        .loading-container { display: flex; justify-content: center; padding: 4rem; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--color-border); border-top-color: var(--color-accent-primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        .hidden { display: none !important; }
        .lang-toggle { position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 999; width: 2.5rem; height: 2.5rem; padding: 0; background: var(--color-bg-elevated); color: var(--color-text-secondary); border: 1px solid var(--color-border); border-radius: 50%; font-size: 1.25rem; cursor: pointer; transition: all var(--transition-base); box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; }
        .lang-toggle:hover { background: var(--color-bg-surface); border-color: var(--color-accent-primary); color: var(--color-accent-primary); transform: none; }

        @media (max-width: 768px) {
            .nav { padding: 0 1rem; }
            .nav-links { display: none; }
            .main { padding: 1.5rem 1rem; }
            .skills-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <button class="lang-toggle" onclick="setLang(getLang()==='en'?'pt':'en')">🌐</button>
    <nav class="nav">
        <a href="/index.html" class="nav-brand">Not The Green Owl</a>
        <div class="nav-links">
            <a href="/index.html" data-i18n="dash.title">Dashboard</a>
            <a href="/learn.html" class="active" data-i18n="learn.title">Learn</a>
            <a href="/profile.html" data-i18n="profile.title">Profile</a>
            <a href="/leaderboard.html" data-i18n="leader.title">Leaderboard</a>
        </div>
        <div class="nav-right">
            <button class="logout-btn" id="logoutBtn" data-i18n="common.logout">Logout</button>
        </div>
    </nav>

    <div class="main">
        <div class="breadcrumb" id="breadcrumb">
            <a id="bcSkills" data-i18n="learn.selectSkill">Skills</a>
        </div>
        <h1 class="page-title" id="pageTitle" data-i18n="learn.selectSkill">Select a Skill</h1>
        <div id="loadingContainer" class="loading-container"><div class="spinner"></div></div>
        <div id="skillsView" class="hidden"><div class="skills-grid" id="skillsGrid"></div></div>
        <div id="levelsView" class="hidden"><div class="levels-list" id="levelsList"></div></div>
        <div id="lessonsView" class="hidden"><div class="lessons-list" id="lessonsList"></div></div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/csrf.js"></script>
    <script src="/js/learn.js"></script>
</body>
</html>
